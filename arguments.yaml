# OpenAudible to AudioBookShelf Configuration
# Replace empty values with your actual configuration

# AudioBookShelf server configuration
server_url: "http://example.com"
abs_api_token: ""
library_id: ""

# Book source configuration
download_program: OpenAudible  # Options: OpenAudible or Libation
books_json_path: ""  # Optional for Libation - will be auto-generated if not provided

# Directory paths
source_audio_book_directory: "/tmp/OpenAudible/books"
destination_book_directory: ""

# File handling options
audio_file_extension: ".m4b"
copy_instead_of_move: false  # Set to true for debugging/testing. Preserves chunk files and intermediate processing files when profanity cleaning is enabled

# Libation-specific options
libation_folder_cleanup: false
libation_file_locations_path: ""  # Optional - path to Libation's FileLocationsV2.json

# Processing options
purchased_how_long_ago: 7  # Number of days to look back (0 = all books)

# Logging
log_file_path: "/tmp/book_processing.txt"

# Debug mode (includes censorship report for profanity cleaning)
debug: false

# Profanity Cleaning Configuration
# Removes profanity from audiobooks using remote Whisper-WebUI transcription
# Set enable_profanity_cleaning to true to enable audio profanity filtering
enable_profanity_cleaning: false
remote_whisper_url: ""  # Required if profanity cleaning enabled (e.g., http://whisper-server:8000)
swears_file: ""  # Optional - path to custom swears file (JSON or text). Leave empty to use MonkeyPlug's default
working_directory: "/tmp/monkeyplug-cleaning"  # Temp directory for processing
save_transcripts: false  # Set to true to keep transcript JSON files for later use
timeout: 600  # Timeout in seconds (600 = 10 minutes, MonkeyPlug default. Increase for very long audiobooks)
beep_mode: false  # Set to true to beep over profanity instead of muting
confidence_threshold: 0.75  # Confidence threshold (0.0-1.0) for censoring words (lower = more aggressive)
